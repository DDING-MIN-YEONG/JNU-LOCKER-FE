name: PR Build Check # 영어로 변경

on:
  pull_request:
    branches: ["main", "dev"]

jobs:
  build: # 간단한 job 이름
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # 버전 문자열로 변경

      - name: Install pnpm
        run: npm install -g pnpm@8.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Check build artifacts
        run: |
          if [ -d ".next" ]; then
            echo "✅ 빌드 성공"
            ls -la .next/
          else
            echo "❌ 빌드 실패"
            exit 1
          fi
